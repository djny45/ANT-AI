<!DOCTYPE html>
<html>
<head>
<title>ANT-AI Hologram</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#050505;font-family:Arial;color:#aaa}
body{display:flex;align-items:center;justify-content:center;flex-direction:column}
.sphere{width:min(70vw,420px);height:min(70vw,420px);border-radius:50%;position:relative;background:radial-gradient(circle,#ff9800 0%,rgba(255,120,0,.35) 25%,rgba(255,120,0,.08) 55%,transparent 72%);box-shadow:0 0 80px #ff8c00,0 0 160px rgba(255,140,0,.35);animation:pulse 3s infinite}
.sphere:before{content:'';position:absolute;inset:25px;border-radius:50%;border:1px solid rgba(255,150,0,.8);box-shadow:inset 0 0 50px #ff9800}
.sphere:after{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(transparent,rgba(255,170,0,.5),transparent);animation:rotate 5s linear infinite}
.bar{position:fixed;bottom:50px;width:min(85%,650px);height:65px;border-radius:22px;border:1px solid rgba(255,140,0,.35);background:rgba(20,20,20,.85);display:flex;align-items:center;padding:0 25px;font-size:20px;box-shadow:0 0 30px rgba(255,140,0,.15)}
.send{margin-left:auto;color:#ff9800;font-size:28px}
@keyframes pulse{50%{transform:scale(1.03)}}
@keyframes rotate{100%{transform:rotate(360deg)}}
@media(max-width:600px){.bar{font-size:16px;height:55px}.sphere:before{inset:15px}}
</style>
</head>
<body>
<div class="sphere"></div>
<div class="bar">Type your command... <span class="send">➤</span></div>
</body>
</html>
