<!DOCTYPE html>
<html>
<head>
<title>ANT-AI Hologram</title>
<style>
html,body{margin:0;height:100%;background:#050505;overflow:hidden;font-family:Arial;color:#aaa}
body{display:flex;align-items:center;justify-content:center;flex-direction:column}
.sphere{width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,#ff9800 0%,rgba(255,120,0,.35) 20%,rgba(255,120,0,.08) 55%,transparent 70%);box-shadow:0 0 80px #ff8c00,0 0 160px rgba(255,140,0,.4);position:relative}
.sphere:before{content:'';position:absolute;inset:25px;border-radius:50%;border:1px solid rgba(255,150,0,.8);box-shadow:inset 0 0 50px #ff9800}
.bar{position:absolute;bottom:70px;width:75%;height:70px;border-radius:20px;border:1px solid rgba(255,140,0,.35);background:rgba(20,20,20,.8);display:flex;align-items:center;padding:0 30px;font-size:22px;box-shadow:0 0 30px rgba(255,140,0,.15)}
.send{margin-left:auto;color:#ff9800;font-size:30px}
</style>
</head>
<body>
<div class="sphere"></div>
<div class="bar">Type your command... <span class="send">➤</span></div>
</body>
</html>
