name: ANT AI Quality and Security Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q ant_langgraph governance_engine intelligence backend tests

      - name: Run deterministic pipeline tests
        run: python -m pytest -q tests/test_integration_pipeline.py

      - name: Dependency audit
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt
