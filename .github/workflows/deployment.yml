name: ANT Deployment Pipeline

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  deployment-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment files
        run: |
          test -f Dockerfile || exit 1
          test -f docker-compose.yml || exit 1
          echo "Deployment configuration validated"
