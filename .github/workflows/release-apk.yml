name: ANT AI Production APK Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required for softprops/action-gh-release to create/upload a release

jobs:
  build-signed-release-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure signing keystore
        working-directory: android_app
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release-key.jks
          cat > key.properties << EOF
          storeFile=release-key.jks
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Create Gradle wrapper
        working-directory: android_app
        run: gradle wrapper --gradle-version 8.7

      - name: Ensure gradlew is executable
        working-directory: android_app
        run: chmod +x gradlew

      - name: Build signed release APK
        working-directory: android_app
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Generate SHA256 checksum
        run: |
          sha256sum android_app/app/build/outputs/apk/release/*.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}
          files: |
            android_app/app/build/outputs/apk/release/*.apk
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
