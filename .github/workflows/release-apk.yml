name: ANT CLAW Production APK Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v1.1.1)"
        required: true
        default: "v1.1.1"

permissions:
  contents: write

jobs:
  release:
    name: Build Signed ANT CLAW APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Build signed release APK
        working-directory: android_app
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare ANT CLAW release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          TAG=${RELEASE_TAG}
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG=${{ inputs.tag }}; fi
          mkdir -p release
          cp android_app/app/build/outputs/apk/release/*.apk release/ANT-CLAW-${TAG}.apk
          sha256sum release/ANT-CLAW-${TAG}.apk > release/SHA256SUMS.txt

      - name: Publish ANT CLAW GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: ANT CLAW ${{ github.ref_name || inputs.tag }} Production Release
          body: |
            # 🐜 ANT CLAW Production APK Release

            Automated production Android build.

            Features:
            - Claude-style AI interface
            - Ollama AI support
            - Streaming response architecture
            - Markdown and code workflows
            - Signed Android APK

            Pipeline:
            Source → Build → Sign → Release → Download
          files: |
            release/*.apk
            release/SHA256SUMS.txt
