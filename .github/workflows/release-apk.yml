 name: ANT AI Production APK Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android_app/release.keystore

      - name: Verify Gradle wrapper
        working-directory: android_app
        run: |
          ls -la
          chmod +x ./gradlew

      - name: Build signed release APK
        working-directory: android_app
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        run: |
          find android_app -name "*.apk"

      - name: Generate SHA256 checksum
        run: |
          mkdir -p release
          cp android_app/app/build/outputs/apk/release/app-release.apk release/ANT-AI-${{ inputs.tag }}.apk
          sha256sum release/ANT-AI-${{ inputs.tag }}.apk > release/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ANT AI ${{ inputs.tag }} Production Release
          body: |
            # ANT AI Production APK Release

            Version: ${{ inputs.tag }}

            Features:
            - Signed Android APK
            - SHA256 verification
            - Automated CI/CD release pipeline
            - ANT AI agent framework

          files: |
            release/ANT-AI-${{ inputs.tag }}.apk
            release/SHA256SUMS.txt
