services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uaat}
      POSTGRES_USER: ${POSTGRES_USER:-uaat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - uaat_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uaat} -d ${POSTGRES_DB:-uaat}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

networks:
  internal:
    driver: bridge

volumes:
  uaat_postgres:
